# Distributed deployment: 1 gate, 1 login, 2 game nodes + NATS, Redis, MongoDB.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   go run ./cmd/robot -addr 127.0.0.1:7000 -n 50
#
# Only the infrastructure:  docker compose -f deploy/docker-compose.yml up -d nats redis mongo

x-node: &node
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  # No shared "image:" name: parallel builds of one tag collide. Each service
  # gets its own tag; layers are cached, so the extra builds are instant.
  restart: unless-stopped
  depends_on:
    nats:
      condition: service_started
    redis:
      condition: service_healthy
    mongo:
      condition: service_healthy
  environment: &env
    NATS_URL: nats://nats:4222
    REDIS_ADDR: redis:6379
    MONGO_URI: mongodb://mongo:27017
    LOG_FORMAT: json

services:
  nats:
    image: nats:2.10
    command: ["-m", "8222"]          # 8222 = monitoring endpoint
    ports: ["4222:4222", "8222:8222"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 20

  game-1:
    <<: *node
    command: ["-config", "/app/configs/game.yaml"]
    environment:
      <<: *env
      NODE_ID: game-1
      GM_ENABLED: "true"

  game-2:
    <<: *node
    command: ["-config", "/app/configs/game.yaml"]
    environment:
      <<: *env
      NODE_ID: game-2
      GM_ENABLED: "true"

  login-1:
    <<: *node
    command: ["-config", "/app/configs/login.yaml"]
    environment:
      <<: *env
      NODE_ID: login-1
      WORKER_ID: "1"

  gate-1:
    <<: *node
    command: ["-config", "/app/configs/gate.yaml"]
    environment:
      <<: *env
      NODE_ID: gate-1
    # Host ports are overridable when 7000/7001/9100 are taken on your machine:
    #   GATE_TCP_PORT=17000 GATE_WS_PORT=17001 GATE_ADMIN_PORT=19100 docker compose ... up -d
    ports:
      - "${GATE_TCP_PORT:-7000}:7000"
      - "${GATE_WS_PORT:-7001}:7001"
      - "${GATE_ADMIN_PORT:-9100}:9100"

volumes:
  mongo-data:

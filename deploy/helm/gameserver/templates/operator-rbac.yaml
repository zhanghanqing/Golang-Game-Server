apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gs.operator" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gs.labels" . | nindent 4 }}
---
# Rules generated by controller-gen from the +kubebuilder:rbac markers
# (operator/config/rbac/role.yaml). The operator watches every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gs.operator" . }}
  labels: {{- include "gs.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, pods, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [gameserver.dev]
    resources: [gameclusters]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [gameserver.dev]
    resources: [gameclusters/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gs.operator" . }}
  labels: {{- include "gs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gs.operator" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gs.operator" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election uses a Lease in the operator's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gs.operator" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gs.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gs.operator" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gs.operator" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "gs.operator" . }}
    namespace: {{ .Release.Namespace }}

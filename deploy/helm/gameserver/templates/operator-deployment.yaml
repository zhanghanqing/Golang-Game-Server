apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gs.operator" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gs.labels" . | nindent 4 }}
    app.kubernetes.io/name: gameserver-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gameserver-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameserver-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "gs.operator" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --poll-interval={{ .Values.operator.pollInterval }}
            - --zap-log-level={{ .Values.operator.logLevel }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            periodSeconds: 5
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }

syntax = "proto3";

package gs.game;

option go_package = "gameserver/game/pb";

// LoginReq authenticates an account. Unknown accounts are registered automatically (demo behaviour).
message LoginReq {
  string account = 1;
  string password = 2;
  string client_version = 3;
}

message LoginResp {
  int64 uid = 1;
  bool new_account = 2;
  int64 server_time_ms = 3;
}

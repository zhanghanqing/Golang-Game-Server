syntax = "proto3";

package gs.game;

option go_package = "gameserver/game/pb";

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_WORLD = 1; // every online player
  CHAT_CHANNEL_SCENE = 2; // players that can see the sender (AOI)
}

message ChatSendReq {
  ChatChannel channel = 1;
  string text = 2;
}

message ChatSendResp {}

message ChatPush {
  ChatChannel channel = 1;
  int64 from_uid = 2;
  string from_name = 3;
  string text = 4;
  int64 time_ms = 5;
}
